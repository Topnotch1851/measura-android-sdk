# =============================================================================
# Gradle properties for the Measura Android SDK.
#
# The SDK itself deliberately depends on no AndroidX library: its only runtime
# dependencies are the Kotlin stdlib, coroutines and the Play Install Referrer
# client. That is a size decision, and it is why this file did not exist until
# instrumentation tests were added.
#
# The androidTest source set is different. androidx.test.ext:junit and the test
# runner are AndroidX, and AGP refuses to build a configuration containing
# AndroidX artifacts unless useAndroidX is set, which is what failed the first
# instrumentation run with checkReleaseAndroidTestAarMetadata.
#
# Enabling this affects the test classpath only. It does not add anything to
# the published AAR; the size gate in CI is the check that keeps that honest.
# =============================================================================

android.useAndroidX=true

# Not needed today (nothing here depends on a pre-AndroidX support library) and
# left off deliberately: Jetifier rewrites every dependency at build time and
# slows the build for no benefit here.
android.enableJetifier=false

# Keeps the Gradle daemon from being starved on CI runners.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
